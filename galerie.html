<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galerie — Espaignet Photography</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:wght@300;400;500&display=swap');
:root{--cream:#f5f0e8;--sepia:#c8a97e;--dark:#111009;--gold:#b8923a;--light-sepia:#e8dcc8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--cream);font-family:'Cormorant Garamond',serif;font-weight:300;overflow-x:hidden;cursor:none;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:900;opacity:.4;}
.cursor{width:14px;height:14px;border:1px solid var(--gold);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s;}
.cursor-dot{width:4px;height:4px;background:var(--gold);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
.navbar{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:1.6rem 5rem;transition:background .4s,border .4s;}
.navbar.scrolled{background:rgba(17,16,9,.97);border-bottom:1px solid rgba(184,146,58,.15);}
.nav-logo{font-family:'Playfair Display',serif;font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);text-decoration:none;}
.nav-links{display:flex;gap:2.5rem;align-items:center;}
.nav-links a{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);text-decoration:none;transition:color .3s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);}
.nav-links a.nav-cta{border:1px solid var(--gold);padding:.5rem 1.2rem;color:var(--gold);}
.nav-links a.nav-cta:hover{background:var(--gold);color:var(--dark);}

/* PAGE HEADER */
.page-header{padding:11rem 5rem 5rem;text-align:center;}
.eyebrow{font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;display:block;opacity:0;animation:fadeUp 1s .2s forwards;}
.page-header h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:400;opacity:0;animation:fadeUp 1s .4s forwards;}
.page-header h1 em{font-style:italic;color:var(--gold);}
.page-header-line{width:60px;height:1px;background:var(--gold);margin:2rem auto;opacity:0;animation:fadeUp 1s .5s forwards;}
.page-header p{font-size:1.1rem;font-style:italic;color:var(--sepia);opacity:0;animation:fadeUp 1s .6s forwards;}

/* MASONRY GRID */
.gallery-wrap{padding:3rem 4rem 8rem;max-width:1400px;margin:0 auto;}
.masonry{columns:3;column-gap:1.2rem;}
.mcard{break-inside:avoid;margin-bottom:1.2rem;position:relative;overflow:hidden;cursor:none;}
.mcard img{width:100%;display:block;filter:sepia(30%) contrast(1.12) brightness(.88);transition:transform .8s cubic-bezier(.25,.46,.45,.94),filter .5s;}
.mcard:hover img{transform:scale(1.04);filter:sepia(5%) contrast(1.2) brightness(.95);}
.mcard-info{position:absolute;inset:0;background:linear-gradient(to top,rgba(17,16,9,.85) 0%,transparent 55%);opacity:0;transition:opacity .4s;display:flex;flex-direction:column;justify-content:flex-end;padding:1.8rem;}
.mcard:hover .mcard-info{opacity:1;}
.mcard-title{font-family:'IM Fell English',serif;font-style:italic;font-size:1.05rem;color:var(--cream);}
.mcard-sub{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sepia);margin-top:.3rem;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(17,16,9,.97);z-index:800;display:none;align-items:center;justify-content:center;padding:2rem;}
.lightbox.open{display:flex;}
.lb-img{max-width:85vw;max-height:85vh;object-fit:contain;filter:sepia(20%) contrast(1.1);}
.lb-close{position:absolute;top:2rem;right:2.5rem;font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold);cursor:none;transition:opacity .3s;}
.lb-close:hover{opacity:.6;}
.lb-caption{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);text-align:center;}
.lb-caption span{font-family:'IM Fell English',serif;font-style:italic;font-size:1.1rem;color:var(--sepia);}

/* FOOTER */
footer{background:var(--dark);padding:3rem 5rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(184,146,58,.15);}
.footer-logo{font-family:'Playfair Display',serif;font-size:.9rem;letter-spacing:.2em;text-transform:uppercase;}
.footer-copy{font-size:.78rem;color:var(--sepia);}
.footer-links a{color:var(--sepia);text-decoration:none;font-size:.78rem;margin-left:2rem;transition:color .3s;}
.footer-links a:hover{color:var(--gold);}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s;}
.reveal.visible{opacity:1;transform:translateY(0);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:900px){
  .navbar{padding:1.2rem 2rem;}.nav-links{gap:1rem;}.nav-links a{font-size:.65rem;}
  .page-header{padding:8rem 2rem 3rem;}
  .gallery-wrap{padding:2rem 1.2rem 5rem;}.masonry{columns:2;}
  footer{flex-direction:column;gap:1rem;text-align:center;padding:2rem;}
}
@media(max-width:500px){.masonry{columns:1;}}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-dot" id="cursorDot"></div>

<nav class="navbar" id="navbar">
  <a href="index.html" class="nav-logo">Espaignet Photography</a>
  <div class="nav-links">
    <a href="galerie.html" class="active">Galerie</a>
    <a href="apropos.html">À propos</a>
    <a href="processus.html">Processus</a>
    <a href="tarifs.html">Tarifs</a>
    <a href="contact.html" class="nav-cta">Contact</a>
  </div>
</nav>

<div class="page-header">
  <span class="eyebrow">Chambre A.Tardy · Papier 13×18 · Bordeaux</span>
  <h1>La <em>galerie</em></h1>
  <div class="page-header-line"></div>
  <p>Chaque image est unique. Il n'en existe qu'un seul tirage au monde.</p>
</div>

<div class="gallery-wrap">
  <div class="masonry" id="masonryGrid">
    <!-- Cards injected by JS -->
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lb-close" id="lbClose">✕</span>
  <img class="lb-img" id="lbImg" src="" alt=""/>
  <div class="lb-caption"><span id="lbCaption"></span></div>
</div>

<footer>
  <span class="footer-logo">Espaignet Photography</span>
  <span class="footer-copy">© 2024 · Noé Espaignet · Bordeaux</span>
  <div class="footer-links">
    <a href="tarifs.html">Tarifs</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script>
const photos=[
  {src:'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800&q=80',title:'Place de la Victoire',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=800&q=80',title:'Homme au regard lointain',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700&q=80',title:'Quai des Chartrons',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1552058544-f2b08422138a?w=700&q=80',title:'Marché des Capucins',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1504703395950-b89145a5425b?w=700&q=80',title:'Rue Sainte-Catherine',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1532074205216-d0e1f4b87368?w=800&q=80',title:'Jardin Public',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=700&q=80',title:'Sourire volé',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1547425260-76bcadfb4f2c?w=700&q=80',title:'Portrait de rue',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=700&q=80',title:'L\'homme au manteau',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=700&q=80',title:'Regard franc',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1521119989659-a83eee488004?w=700&q=80',title:'Silhouette, matin brumeux',sub:'Bordeaux · 2024'},
  {src:'https://images.unsplash.com/photo-1499996860823-5214fcc65f8f?w=700&q=80',title:'La passante',sub:'Bordeaux · 2024'},
];

const grid=document.getElementById('masonryGrid');
photos.forEach(p=>{
  const card=document.createElement('div');
  card.className='mcard reveal';
  card.innerHTML=`<img src="${p.src}" alt="${p.title}" loading="lazy"/><div class="mcard-info"><span class="mcard-title">${p.title}</span><span class="mcard-sub">${p.sub}</span></div>`;
  card.addEventListener('click',()=>openLb(p));
  grid.appendChild(card);
});

function openLb(p){
  document.getElementById('lbImg').src=p.src;
  document.getElementById('lbCaption').textContent=p.title+' — '+p.sub;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lbClose').addEventListener('click',()=>document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open');});

const cursor=document.getElementById('cursor'),dot=document.getElementById('cursorDot');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';});
window.addEventListener('scroll',()=>document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>60));
const obs=new IntersectionObserver(entries=>{entries.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*80);obs.unobserve(e.target);}});},{threshold:.05});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
</script>
</body>
</html>
